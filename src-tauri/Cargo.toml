[package]
name = "linktolinux"
version = "1.0.0"
description = "Phone Link for Linux and Android"
authors = ["LinkToLinux"]
edition = "2021"
license-file = "../LICENSE"
repository = "https://github.com/prawinin/linktolinux"
rust-version = "1.85"

[lib]
name = "linktolinux_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "process", "time", "fs", "signal"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10.9"
gtk = "0.18.2"
getrandom = "0.4.3"
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
